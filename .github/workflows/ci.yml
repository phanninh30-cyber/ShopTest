name: CI - Automation Test

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      group:
        description: "Nhóm UI test: smoke, regression, crud, login, register, security"
        required: false
        default: "smoke"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy source code
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 1. Build WAR và chạy unit test (mặc định groups=unit)
      - name: Build WAR + chạy unit test
        run: mvn -B package

      - name: Lưu báo cáo unit test
        if: always()
        run: |
          mkdir -p reports/unit
          cp -r target/surefire-reports/. reports/unit/ || true
          mvn -B -q surefire-report:report-only || true
          cp target/reports/surefire.html reports/unit/unit-report.html || true

      # 2. Cài Tomcat 10.1 và triển khai ứng dụng
      - name: Cài và chạy Tomcat
        run: |
          curl -sSL -o tomcat.tar.gz https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.31/bin/apache-tomcat-10.1.31.tar.gz
          mkdir tomcat
          tar -xzf tomcat.tar.gz -C tomcat --strip-components=1
          cp target/ShopTest.war tomcat/webapps/
          tomcat/bin/startup.sh

      - name: Chờ ứng dụng sẵn sàng
        run: |
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:8080/ShopTest/login; then
              echo "App is up"; exit 0
            fi
            sleep 3
          done
          echo "App did not start"; cat tomcat/logs/catalina.out || true; exit 1

      # 3. Chạy Selenium (Chrome có sẵn trên ubuntu-latest)
      - name: Chạy UI test (TestNG + Selenium, headless)
        run: >
          mvn -B test
          -Dgroups=${{ github.event.inputs.group || 'smoke' }}
          -Dbase.url=http://localhost:8080/ShopTest
          -Dheadless=true

      - name: Lưu báo cáo UI test
        if: always()
        run: |
          mkdir -p reports/ui
          cp -r target/surefire-reports/. reports/ui/ || true
          mvn -B -q surefire-report:report-only || true
          cp target/reports/surefire.html reports/ui/ui-report.html || true
          cp -r target/screenshots reports/ui/screenshots || true

      # 4. Upload báo cáo lên Artifacts
      - name: Upload report lên Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/